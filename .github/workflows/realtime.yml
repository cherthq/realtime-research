name: Realtime demo checks
on:
  push:
    paths: ['realtime/**', 'configs/**', 'scripts/**', 'infra/**', 'docs/recreate-demo.md', '.github/workflows/realtime.yml']
  pull_request:
    paths: ['realtime/**', 'configs/**', 'scripts/**', 'infra/**', 'docs/recreate-demo.md', '.github/workflows/realtime.yml']
permissions:
  contents: read
jobs:
  cpu-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            realtime/requirements.txt
            realtime/constraints-linux-py311.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: realtime/web/package-lock.json
      - run: python -m pip install -r realtime/requirements.txt -c realtime/constraints-linux-py311.txt ruff==0.14.1
      - run: python -m pip check
      - run: python scripts/check_public_tree.py
      - run: ruff check realtime scripts --select E9,F
      - run: ruff format --check realtime scripts/check_public_tree.py
      - run: python -m pytest realtime/tests -q
      - run: npm ci
        working-directory: realtime/web
      - run: npm run build
        working-directory: realtime/web
      - run: npm run format:check
        working-directory: realtime/web
